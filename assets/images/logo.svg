<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#B44446" />
            <stop offset="50%" stop-color="#64242F" />
            <stop offset="100%" stop-color="#2D0D12" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FC8F8F" />
            <stop offset="100%" stop-color="#B44446" />
        </linearGradient>
        <filter id="shadow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64242F" flood-opacity="0.15"/>
        </filter>
    </defs>
    
    <!-- Outer Shield with Rounded Corners -->
